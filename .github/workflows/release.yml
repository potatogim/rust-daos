name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      # the real-daos job may pull its test image from ghcr.io (it rebuilds
      # from scratch on a tag, but the job asks for the permission)
      packages: read

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      # gh release create
      contents: write
      # crates.io Trusted Publishing (OIDC); no long-lived token is stored
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: tag matches the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 |
            python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - name: package contents
        run: cargo package --list
      - name: crates.io token from Trusted Publishing
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: GitHub release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]*\]: / { exit }
            on { print }' CHANGELOG.md >notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
