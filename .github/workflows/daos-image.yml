name: DAOS test image

# Builds the image of the real-daos CI job (ci/daos) and pushes it to
# ghcr.io. Only main pushes; branches and pull requests build their own copy
# in ci.yml, and releases rebuild from scratch. The tag hashes only the
# Dockerfile (ci/daos/image-tag.sh).

on:
  push:
    branches: [main]
    paths:
      - ci/daos/Dockerfile
      - ci/daos/image-tag.sh
      - .github/workflows/daos-image.yml
  workflow_dispatch:

permissions:
  contents: read

# One push run at a time; a newer one waits instead of cancelling a push.
concurrency:
  group: daos-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        daos: ["2.6.4", "2.8.1"]
    env:
      DAOS_VERSION: ${{ matrix.daos }}
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/rust-daos-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: image name
        id: image
        # Image names must be lowercase; the owner name need not be.
        run: echo "ref=${IMAGE_REPO,,}:$(ci/daos/image-tag.sh "$DAOS_VERSION")" >>"$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: already pushed?
        id: exists
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        # Build only on "not found"; any other error (registry, auth) fails
        # the job instead of pushing over a tag that may exist.
        run: |
          if out=$(docker manifest inspect "$IMAGE" 2>&1); then
            echo "$IMAGE exists"
            echo "found=true" >>"$GITHUB_OUTPUT"
          elif grep -qiE 'no such manifest|manifest unknown|not found' <<<"$out"; then
            echo "$IMAGE not pushed yet"
            echo "found=false" >>"$GITHUB_OUTPUT"
          else
            echo "$out" >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: steps.exists.outputs.found != 'true'
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        if: steps.exists.outputs.found != 'true'
        with:
          context: ci/daos
          build-args: DAOS_VERSION=${{ matrix.daos }}
          tags: ${{ steps.image.outputs.ref }}
          push: true
          pull: true
          no-cache: true
