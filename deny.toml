# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
# The allow list is the project policy; not every entry is used today.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
]

# The crate itself: MIT OR Apache-2.0 (Cargo.toml `license`). Declarations
# transcribed from DAOS headers are BSD-2-Clause-Patent; see
# LICENSE-THIRD-PARTY.
[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
